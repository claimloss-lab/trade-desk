name: MA Cross Signal Trigger

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call MA Cross Signal worker
        run: |
          echo "=== Calling /machross-trigger ==="
          curl -s -X GET "https://trade-desk-watchlist-alert.claimloss.workers.dev/machross-trigger?key=${{ secrets.ALERT_SECRET }}" \
            --max-time 60 \
            -w "\nHTTP_STATUS:%{http_code}" \
            | tee /tmp/response.txt
          echo ""
          grep -q "HTTP_STATUS:200" /tmp/response.txt || {
            echo "❌ MA cross trigger failed"
            exit 1
          }
