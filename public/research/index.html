<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StockRoom</title><style>
  :root{--bg:#f5f5f7;--fg:#1a1a1a;--card:#fff;--border:#dcdce0;--muted:#6b6b76;--accent:#2557d6;--accent-bg:#eaf0fe;--badge:#e6eefc;}
  @media(prefers-color-scheme:dark){:root{--bg:#14141a;--fg:#eaeaf0;--card:#1e1e26;--border:#33333d;--muted:#a0a0ac;--accent:#7aa2ff;--accent-bg:#202a44;--badge:#1c2438;}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Leelawadee UI","Noto Sans Thai",sans-serif;line-height:1.7;}
  .wrap{max-width:860px;margin:0 auto;padding:40px 24px 64px}
  .ticker{font-size:2.2rem;font-weight:800;margin:0 0 2px} .meta{color:var(--muted);font-size:.9rem}
  .back{display:inline-block;margin-bottom:14px;color:var(--accent);text-decoration:none;font-weight:600}
  h1{font-size:1.8rem;border-bottom:2px solid var(--accent);padding-bottom:8px}
  h2{font-size:1.25rem;margin-top:26px;border-bottom:1px solid var(--border);padding-bottom:6px}
  h3{color:var(--accent);font-size:1.02rem;margin:14px 0 4px} p{margin:8px 0}
  ul{margin:6px 0;padding-left:22px} li{margin:5px 0}
  blockquote{background:var(--accent-bg);border-left:4px solid var(--accent);margin:12px 0;padding:10px 14px;border-radius:0 8px 8px 0;color:var(--muted)}
  code{background:var(--badge);padding:1px 5px;border-radius:5px;font-size:.92em}

  header{max-width:1100px;margin:0 auto;padding:28px 24px 10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  header h1{margin:0;font-size:1.5rem;font-weight:800} header p{margin:0;color:var(--muted);font-size:.85rem}
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.toolbar select{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--fg)}.toolbar>a{color:var(--accent);font-size:.85rem;text-decoration:none;font-weight:600}
  .search-bar input{border:none;outline:none;background:transparent;color:var(--fg);font-size:.95rem;width:100%}
  main{max-width:1100px;margin:0 auto;padding:10px 24px 60px}
  .section-title{font-size:1rem;font-weight:700;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
  .section-title .ct{font-size:.8rem;font-weight:500;color:var(--muted);background:var(--badge);padding:2px 10px;border-radius:99px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:8px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:5px;transition:box-shadow .15s}
  .card:hover{box-shadow:0 4px 18px rgba(0,0,0,.1)}
  .card-hold{border-color:var(--accent)!important;background:var(--accent-bg)}
  .tk{font-size:1.35rem;font-weight:800;letter-spacing:-.5px}
  .company{color:var(--muted);font-size:.9rem;min-height:2.2em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tag-hold{font-size:.7rem;font-weight:600;color:var(--accent);background:var(--badge);padding:2px 8px;border-radius:99px;align-self:flex-start}
  .dt{font-size:.72rem;color:var(--accent);background:var(--accent-bg);align-self:flex-start;padding:2px 9px;border-radius:99px;margin-top:auto}
  .hidden{display:none!important}
</style></head><body>
<header>
  <div><h1>📚 StockRoom</h1><p>Research Thesis · Powered by Hermes AI · Auto-updated</p></div>
  <div class="toolbar"><select id="sort" onchange="sortCards(this.value)"><option value="date">ใหม่สุดก่อน</option><option value="ticker">Ticker A–Z</option><option value="name">ชื่อบริษัท A–Z</option></select><a href="health.html">Health Check</a><div class="search-bar"><span>🔍</span><input type="text" id="q" placeholder="Search NVDA, Apple…" oninput="doSearch(this.value)"></div></div>
</header>
<main>
  <section id="results-section" class="hidden">
    <div class="section-title">🔎 Results <span class="ct" id="cnt-results">0</span></div>
    <div class="grid" id="results-grid"></div>
  </section>
  <section id="holdings-section">
    <div class="section-title">🎯 Focus <span class="ct">0</span></div>
    <div class="grid" id="grid-hold"></div>
  </section>
  <section id="all-section">
    <div class="section-title">🌐 All Research <span class="ct">1</span></div>
    <div class="grid" id="grid-all"><a class="card" href=".html" style=""><div class="tk"></div><div class="company">Novo Nordisk A/S</div><div class="dt">อัปเดต 2026-09-22</div></a></div>
  </section>
</main>
<script>
function doSearch(q){
  q=q.trim().toLowerCase();
  const cards=[...document.querySelectorAll('#grid-hold .card,#grid-all .card')];
  const matches=cards.filter(c=>{
    const tk=c.querySelector('.tk').textContent.toLowerCase();
    const sn=c.querySelector('.company').textContent.toLowerCase();
    return !q||tk.includes(q)||sn.includes(q);
  });
  const results=document.getElementById('results-section');
  document.getElementById('results-grid').innerHTML=q?matches.map(c=>c.outerHTML).join(''):'';
  document.getElementById('cnt-results').textContent=matches.length;
  results.classList.toggle('hidden',!q);
  document.getElementById('holdings-section').classList.toggle('hidden',!!q);
  document.getElementById('all-section').classList.toggle('hidden',!!q);
}
function sortCards(mode){
  for (const grid of [document.getElementById('grid-hold'), document.getElementById('grid-all')]) {
    if (!grid) continue;
    const cards=[...grid.querySelectorAll('.card')];
    cards.sort((a,b)=>{
      if(mode==='ticker') return a.querySelector('.tk').textContent.localeCompare(b.querySelector('.tk').textContent);
      if(mode==='name') return a.querySelector('.company').textContent.localeCompare(b.querySelector('.company').textContent);
      return b.querySelector('.dt').textContent.localeCompare(a.querySelector('.dt').textContent);
    });
    cards.forEach(c=>grid.appendChild(c));
  }
}
sortCards('date');
</script>
</body></html>
